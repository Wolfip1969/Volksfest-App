# BARS UND GETRÄNKE
# Aufbau wie bei der Speisekarte, nur mit "getraenke:" statt "gerichte:".
#   - name: Weißbier
#     preis: 6,50
#     zusatz: 0,5 l

einleitung: Neben dem Ausschank im Festzelt betreiben die Sparten des SV Bruckmühl ihre Bars, von der Kaffeebar bis zur Schnaps- und Cocktailbar. Die Getränkeliste ist noch ein Beispiel, die echten Preise für 2027 folgen.

